<article class="flex gap-md rounded-md border border-outline bg-surface p-md">
  <div class="size-24 shrink-0 overflow-hidden rounded-sm sm:size-36">
    <app-dish-image class="block size-full" [product]="item()" />
  </div>

  <div class="flex min-w-0 flex-1 flex-col gap-xs">
    <div class="flex items-start justify-between gap-sm">
      <h2 class="font-display text-xl font-bold">{{ item().name }}</h2>

      <div class="shrink-0 text-end">
        <p class="font-display text-xl text-accent-soft tabular-nums">
          <app-price [amount]="lineTotal()" />
        </p>
        @if (discounted()) {
          <p class="text-sm text-warm-grey line-through tabular-nums">
            <app-price [amount]="originalLineTotal()" />
          </p>
        }
      </div>
    </div>

    <p class="w-fit rounded-sm bg-paper/10 px-xs py-2xs text-xs">
      {{ "cart.item.cookedToOrder" | transloco }}
    </p>

    <div
      class="mt-auto flex flex-wrap items-center justify-between gap-sm pt-sm"
    >
      <app-qty-control
        [quantity]="item().quantity"
        [name]="item().name"
        (increment)="increment.emit()"
        (decrement)="decrement.emit()"
      />

      <button
        type="button"
        class="cursor-pointer inline-flex min-h-11 items-center gap-2xs px-xs text-sm text-warm-grey transition-colors hover:text-paper focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-soft"
        [attr.aria-label]="
          'cart.item.removeLabel' | transloco: { name: item().name }
        "
        (click)="remove.emit()"
      >
        <svg lucideTrash class="size-4" [strokeWidth]="1.6"></svg>
        {{ "cart.item.remove" | transloco }}
      </button>
    </div>
  </div>
</article>
