@if (products().length) {
  <section aria-labelledby="add-ons-title">
    <div class="flex flex-wrap items-baseline justify-between gap-sm">
      <h2 id="add-ons-title" class="font-display text-h3 font-bold">
        {{ "cart.addOns.title" | transloco }}
      </h2>
      <p
        class="font-display text-xs uppercase tracking-widest text-accent-soft"
      >
        {{ "cart.addOns.badge" | transloco }}
      </p>
    </div>

    <ul class="mt-md grid gap-md sm:grid-cols-2">
      @for (product of products(); track product.productId) {
        <li
          class="flex items-center gap-sm rounded-md border border-outline bg-surface p-sm"
        >
          <div class="size-16 shrink-0 overflow-hidden rounded-sm">
            <app-dish-image class="block size-full" [product]="product" />
          </div>

          <div class="min-w-0 flex-1">
            <p class="truncate font-display font-bold">{{ product.name }}</p>
            <p class="text-sm text-warm-grey tabular-nums">
              +<app-price [amount]="product.discountedPrice" />
            </p>
          </div>

          <app-qty-control
            [quantity]="0"
            [name]="product.name"
            (add)="add.emit(product)"
          />
        </li>
      }
    </ul>
  </section>
}
