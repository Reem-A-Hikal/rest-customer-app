<section
  id="reviews"
  class="bg-ink text-paper py-2xl"
  aria-labelledby="reviews-heading"
>
  <div class="container">
    <p class="mb-xs font-display text-lead font-semibold text-accent-soft">
      Course Four
    </p>

    <div class="max-w-[42rem] mb-xl">
      <h2 class="font-display text-h2 font-semibold" id="reviews-heading">
        From the last table we don't have
      </h2>
    </div>

    <div class="grid gap-xl lg:grid-cols-3">
      @for (review of reviews; track review.author) {
        <figure
          class="mx-lg mt-sm max-w-[26rem] lg:[&:nth-child(2)]:mt-xl lg:[&:nth-child(3)]:mt-2xl"
        >
          <span
            class="block mb-[0.5rem] font-display text-[2.5rem] leading-none text-accent-soft"
            aria-hidden="true"
            >"</span
          >
          <blockquote>
            <p class="font-display text-xl italic leading-[1.4]">
              {{ review.quote }}
            </p>
          </blockquote>
          <figcaption class="mt-sm text-sm text-warm-grey">
            {{ review.author }}
          </figcaption>
        </figure>
      }
    </div>
  </div>
</section>
