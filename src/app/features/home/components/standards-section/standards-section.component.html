<section
  id="standards"
  class="bg-paper text-charcoal py-2xl"
  aria-labelledby="standards-heading"
>
  <div class="container">
    <p class="mb-xs font-display text-lead font-semibold text-accent-strong">
      {{ "home.standards.marker" | transloco }}
    </p>
    <h2
      id="standards-heading"
      class="sr-only font-display text-h2 font-semibold"
    >
      {{ "home.standards.heading" | transloco }}
    </h2>

    <figure
      class="max-w-[34rem] border-s-2 border-accent-strong ps-md m-[2rem]"
    >
      <blockquote>
        <p class="font-display font-medium italic rtl:not-italic text-quote">
          {{ "home.standards.quote" | transloco }}
        </p>
      </blockquote>
      <figcaption class="mt-md text-sm text-muted-on-light">
        {{ "home.standards.attribution" | transloco }}
      </figcaption>
    </figure>

    <div
      class="mt-2xl pt-lg border-t border-charcoal/14 grid gap-lg md:grid-cols-2 lg:grid-cols-4"
    >
      @for (standard of standards; track standard.titleKey) {
        <div>
          <h3 class="text-[1.0625rem] font-semibold">
            {{ standard.titleKey | transloco }}
          </h3>
          <p class="mt-[0.4rem] max-w-[26rem] text-sm text-muted-on-light">
            {{ standard.descriptionKey | transloco }}
          </p>
        </div>
      }
    </div>
  </div>
</section>
