<section
  id="standards"
  class="bg-paper text-charcoal py-2xl"
  aria-labelledby="standards-heading"
>
  <div class="container">
    <p class="mb-xs font-display text-lead font-semibold text-accent-strong">
      Course Three
    </p>
    <h2
      id="standards-heading"
      class="sr-only font-display text-h2 font-semibold"
    >
      Our standards
    </h2>

    <figure
      class="max-w-[34rem] border-l-2 border-accent-strong pl-md m-[2rem]"
    >
      <blockquote>
        <p class="font-display font-medium italic text-quote">
          "{{ quote.text }}"
        </p>
      </blockquote>
      <figcaption class="mt-md font-body-en text-sm text-muted-on-light">
        — {{ quote.author }}, {{ quote.role }}
      </figcaption>
    </figure>

    <div
      class="mt-2xl pt-lg border-t border-charcoal/14 grid gap-lg md:grid-cols-2 lg:grid-cols-4"
    >
      @for (standard of standards; track standard.title) {
        <div>
          <h3 class="font-body-en text-[1.0625rem] font-semibold">
            {{ standard.title }}
          </h3>
          <p class="mt-[0.4rem] max-w-[26rem] text-sm text-muted-on-light">
            {{ standard.description }}
          </p>
        </div>
      }
    </div>
  </div>
</section>
