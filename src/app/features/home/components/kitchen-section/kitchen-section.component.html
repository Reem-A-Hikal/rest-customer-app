<section
  id="kitchen"
  class="bg-paper py-2xl text-charcoal"
  aria-labelledby="kitchen-heading"
>
  <div class="container grid gap-xl md:grid-cols-2 md:items-start">
    <div>
      <p class="mb-xs font-display text-lead font-semibold text-accent-strong">
        {{ "home.kitchen.marker" | transloco }}
      </p>
      <h2 id="kitchen-heading" class="font-display text-h2 font-semibold">
        {{ "home.kitchen.heading" | transloco }}
      </h2>
    </div>

    <div>
      <p class="text-lead text-muted-on-light">
        {{ "home.kitchen.p1" | transloco }}
      </p>
      <p class="mt-md text-lead text-muted-on-light">
        {{ "home.kitchen.p2" | transloco }}
      </p>

      <dl
        class="mt-lg grid grid-cols-2 gap-md pt-lg border-t border-charcoal/14"
      >
        <div>
          <dt class="font-display text-3xl text-accent-strong">18</dt>
          <dd class="text-sm text-muted-on-light">
            {{ "home.kitchen.stat1Label" | transloco }}
          </dd>
        </div>
        <div>
          <dt class="font-display text-3xl text-accent-strong">0</dt>
          <dd class="text-sm text-muted-on-light">
            {{ "home.kitchen.stat2Label" | transloco }}
          </dd>
        </div>
      </dl>
    </div>
  </div>
</section>
