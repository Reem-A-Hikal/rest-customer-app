@if (quantity === 0) {
  <button
    type="button"
    appFlyToCart
    (click)="add.emit()"
    [attr.aria-label]="
      (name ? 'qty.addNamed' : 'qty.add') | transloco: { name }
    "
    class="grid h-10 w-10 place-items-center rounded-full border border-paper/30 text-paper transition-colors hover:border-accent-soft hover:text-accent-soft"
  >
    <span aria-hidden="true">+</span>
  </button>
} @else {
  <div
    class="flex items-center gap-1 rounded-full border border-flame bg-ink px-2 py-1"
  >
    <button
      type="button"
      (click)="decrement.emit()"
      [attr.aria-label]="
        (name ? 'qty.decreaseNamed' : 'qty.decrease') | transloco: { name }
      "
      class="h-6 w-6 rounded-full text-signature-soft"
    >
      <span aria-hidden="true">−</span>
    </button>
    <span class="text-sm font-bold text-signature-soft">{{ quantity }}</span>
    <button
      type="button"
      appFlyToCart
      (click)="increment.emit()"
      [attr.aria-label]="
        (name ? 'qty.increaseNamed' : 'qty.increase') | transloco: { name }
      "
      class="h-6 w-6 rounded-full text-signature-soft"
    >
      <span aria-hidden="true">+</span>
    </button>
  </div>
}
