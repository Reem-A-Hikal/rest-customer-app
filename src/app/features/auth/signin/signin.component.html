<app-auth-shell title="Welcome back" subtitle="Sign in to confirm your order.">
  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    novalidate
    class="flex flex-col gap-md"
  >
    <app-form-field label="Email" inputId="signin-email" [error]="emailError()">
      <input
        id="signin-email"
        type="email"
        formControlName="email"
        autocomplete="email"
        inputmode="email"
        aria-label="Email"
        [attr.aria-invalid]="!!emailError()"
        [attr.aria-describedby]="emailError() ? 'signin-email-error' : null"
      />
    </app-form-field>

    <app-password-field
      inputId="signin-password"
      [control]="form.controls.password"
      [error]="passwordError()"
    />

    @if (serverError(); as message) {
      <p class="text-sm text-danger" role="alert">{{ message }}</p>
    }

    <button
      type="submit"
      class="cursor-pointer min-h-12 w-full rounded-sm bg-accent-soft px-md font-display text-lg font-bold text-ink transition-colors hover:bg-amber focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-paper disabled:cursor-not-allowed disabled:opacity-50"
      [disabled]="submitting()"
    >
      {{ submitting() ? "Signing in…" : "Sign in" }}
    </button>

    <p class="text-center text-sm text-warm-grey">
      New to REST?
      <a
        routerLink="/register"
        [queryParams]="returnQuery"
        class="font-semibold text-accent-soft hover:underline"
      >
        Create an account
      </a>
    </p>
  </form>
</app-auth-shell>
