<app-auth-shell title="address.add.title" subtitle="address.add.subtitle">
  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    novalidate
    class="flex flex-col gap-md"
  >
    <fieldset>
      <legend class="mb-xs text-sm font-semibold">
        {{ "address.fields.type" | transloco }}
      </legend>

      <div class="grid grid-cols-3 gap-2xs rounded-sm bg-ink/40 p-2xs">
        @for (type of addressTypes; track type.value) {
          <label
            class="flex min-h-11 cursor-pointer items-center justify-center rounded-sm text-sm font-semibold text-warm-grey transition-colors has-[:checked]:bg-paper/10 has-[:checked]:text-paper has-[:focus-visible]:outline-2 has-[:focus-visible]:outline-accent-soft"
          >
            <input
              type="radio"
              class="sr-only"
              formControlName="addressType"
              [value]="type.value"
            />
            {{ type.labelKey | transloco }}
          </label>
        }
      </div>
    </fieldset>

    <app-form-field
      label="address.fields.line1"
      inputId="address-line1"
      [error]="fieldError('addressLine1')"
    >
      <input
        id="address-line1"
        type="text"
        dir="auto"
        formControlName="addressLine1"
        autocomplete="address-line1"
        [attr.aria-label]="'address.fields.line1' | transloco"
        [attr.aria-invalid]="!!fieldError('addressLine1')"
        [attr.aria-describedby]="
          fieldError('addressLine1') ? 'address-line1-error' : null
        "
      />
    </app-form-field>

    <app-form-field
      label="address.fields.line2"
      inputId="address-line2"
      [optional]="true"
      [error]="fieldError('addressLine2')"
    >
      <input
        id="address-line2"
        type="text"
        dir="auto"
        formControlName="addressLine2"
        autocomplete="address-line2"
        [attr.aria-label]="'address.fields.line2' | transloco"
        [attr.aria-invalid]="!!fieldError('addressLine2')"
        [attr.aria-describedby]="
          fieldError('addressLine2') ? 'address-line2-error' : null
        "
      />
    </app-form-field>

    <app-form-field
      label="address.fields.area"
      inputId="address-city"
      [error]="fieldError('city')"
    >
      <select
        id="address-city"
        formControlName="city"
        [attr.aria-label]="'address.fields.area' | transloco"
        [attr.aria-invalid]="!!fieldError('city')"
        [attr.aria-describedby]="
          fieldError('city') ? 'address-city-error' : null
        "
      >
        <option value="" disabled>
          {{ "address.fields.areaPlaceholder" | transloco }}
        </option>
        @for (area of areas; track area.value) {
          <option [value]="area.value">{{ area.labelKey | transloco }}</option>
        }
      </select>
    </app-form-field>

    @if (serverError(); as message) {
      <p class="text-sm text-danger" role="alert">{{ message }}</p>
    }

    <button
      type="submit"
      class="min-h-12 w-full cursor-pointer rounded-sm bg-accent-soft px-md font-display text-lg font-bold text-ink transition-colors hover:bg-amber focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-paper disabled:cursor-not-allowed disabled:opacity-50"
      [disabled]="submitting()"
    >
      {{
        (submitting() ? "address.add.submitting" : "address.add.submit")
          | transloco
      }}
    </button>

    <button
      type="button"
      class="min-h-11 cursor-pointer text-sm font-semibold text-warm-grey transition-colors hover:text-paper"
      (click)="cancel()"
    >
      {{ "common.cancel" | transloco }}
    </button>
  </form>
</app-auth-shell>
