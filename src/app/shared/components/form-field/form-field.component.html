<div
  class="flex flex-col gap-2xs [&_:is(input,select)]:min-h-11 [&_:is(input,select)]:w-full [&_:is(input,select)]:rounded-sm [&_:is(input,select)]:border [&_:is(input,select)]:border-outline [&_:is(input,select)]:bg-ink [&_:is(input,select)]:ps-sm [&_:is(input,select)]:pe-sm [&_:is(input,select)]:text-paper [&_input]:placeholder:text-warm-grey [&_select]:[color-scheme:dark] [&_:is(input,select)[aria-invalid=true]]:border-danger [&_:is(input,select)]:focus-visible:outline-2 [&_:is(input,select)]:focus-visible:outline-offset-2 [&_:is(input,select)]:focus-visible:outline-accent-soft"
>
  <label
    [attr.for]="inputId()"
    class="flex items-baseline justify-between text-sm font-semibold"
  >
    {{ label() | transloco }}
    @if (optional()) {
      <span class="font-normal text-warm-grey">{{
        "common.optional" | transloco
      }}</span>
    }
  </label>

  <ng-content />

  @if (error()) {
    <p [id]="inputId() + '-error'" class="text-sm text-danger" role="alert">
      {{ error() | transloco  }}
    </p>
  }
</div>
