<header
  [class]="headerStateClasses"
  class="fixed start-0 end-0 top-0 z-[100] transition-[background-color,padding,box-shadow] duration-300"
>
  <div class="container flex items-center gap-md">
    <a routerLink="/" class="relative z-10 me-auto flex items-center gap-2xs">
      <app-brand-logo></app-brand-logo>
    </a>

    <div class="relative z-10 flex items-center gap-md lg:order-2">
      <button
        type="button"
        (click)="language.toggle()"
        [attr.aria-label]="
          (language.lang() === 'ar' ? 'header.switchToEn' : 'header.switchToAr')
            | transloco
        "
        class="grid size-11 flex-none cursor-pointer place-items-center rounded-full border border-paper/30 font-body-en text-xs font-semibold text-paper transition-colors hover:border-amber hover:text-amber"
      >
        {{ language.lang() === "ar" ? "EN" : "AR" }}
      </button>

      <a
        #cartLink
        routerLink="/cart"
        [attr.aria-label]="'header.cart' | transloco: { count: shownCount() }"
        class="relative grid size-11 flex-none cursor-pointer place-items-center rounded-full border border-paper/30 text-paper transition-colors hover:border-amber hover:text-amber"
      >
        <svg lucideShoppingCart class="size-5" [strokeWidth]="1.6"></svg>
        @if (shownCount() > 0) {
          @for (count of [shownCount()]; track count) {
            <span
              class="absolute -end-1 -top-1 grid min-w-5 animate-badge-pop place-items-center rounded-full bg-flame px-1 font-body-en text-[0.6875rem] font-semibold leading-5 text-paper"
            >
              {{ count }}
            </span>
          }
        }
      </a>
    </div>

    @if (showMenuToggle()) {
      <button
        type="button"
        class="relative z-10 grid size-11 flex-none cursor-pointer place-items-center rounded-full border border-paper/30 text-paper transition-colors hover:border-amber hover:text-amber lg:hidden"
        aria-controls="header-panel"
        [attr.aria-expanded]="isOpen()"
        [attr.aria-label]="
          (isOpen() ? 'header.menu.close' : 'header.menu.open') | transloco
        "
        (click)="toggle()"
      >
        @if (isOpen()) {
          <svg lucideX class="size-5" stroke-width="1.6"></svg>
        } @else {
          <svg lucideMenu class="size-5" stroke-width="1.6"></svg>
        }
      </button>
    }
    <div
      id="header-panel"
      [class]="panelClasses"
      (click)="onPanelClick($event)"
    >
      <div class="empty:hidden lg:order-1">
        <ng-content select="[headerLinks]"></ng-content>
      </div>
      <div class="empty:hidden lg:order-3">
        <ng-content select="[headerCta]"></ng-content>
      </div>
    </div>
  </div>
</header>
