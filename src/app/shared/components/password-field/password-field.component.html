<app-form-field [label]="label()" [inputId]="inputId()" [error]="error()">
  <div class="relative">
    <input
      [id]="inputId()"
      [type]="visible() ? 'text' : 'password'"
      [formControl]="control()"
      [attr.autocomplete]="autocomplete()"
      [attr.aria-invalid]="!!error()"
      [attr.aria-describedby]="error() ? inputId() + '-error' : null"
      class="pe-12!"
    />

    <button
      type="button"
      class="cursor-pointer absolute inset-y-0 end-0 grid w-11 place-items-center text-warm-grey transition-colors hover:text-paper"
      [attr.aria-label]="visible() ? 'Hide password' : 'Show password'"
      [attr.aria-pressed]="visible()"
      (click)="visible.set(!visible())"
    >
      @if (visible()) {
        <svg lucideEye class="size-5" [strokeWidth]="1.6"></svg>
      } @else {
        <svg lucideEyeOff class="size-5" [strokeWidth]="1.6"></svg>
      }
    </button>
  </div>
</app-form-field>
